name: 'realtypro'
recipe: 'drupal8'
config:
  php: '7.4'
  via: 'nginx'
  webroot: './web'
  database: mariadb:10.4
  composer_version: '2'
  xdebug: true
  config:
    php: lando.php.ini
services:
  appserver:
    build:
      - composer install
    overrides:
      environment:
        DRUSH_OPTIONS_URI: "https://realtypro.lndo.site"
  pma:
    type: phpmyadmin
